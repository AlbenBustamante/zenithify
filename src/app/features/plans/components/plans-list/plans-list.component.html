@if (loading()) {
  <div class="flex flex-col gap-y-3 sm:gap-y-4">
    @for (i of [1,2,3,4,5]; track i) {
      <div class="flex items-center gap-4 rounded-2xl bg-white/60 p-4 sm:p-5 shadow-sm border border-slate-100/80">
        <app-skeleton width="3rem" height="3rem" />
        <div class="flex-1 flex flex-col gap-y-3">
          <app-skeleton width="40%" height="1rem" />
          <app-skeleton width="25%" height="0.75rem" />
        </div>
        <div class="hidden sm:flex sm:flex-col sm:gap-y-2 sm:items-center">
          <app-skeleton width="3rem" height="0.875rem" />
          <app-skeleton width="2rem" height="0.625rem" />
        </div>
        <div class="hidden sm:flex sm:flex-col sm:gap-y-2 sm:items-center">
          <app-skeleton width="4rem" height="0.75rem" />
        </div>
        <div class="hidden sm:block">
          <app-skeleton width="3.5rem" height="1.25rem" />
        </div>
      </div>
    }
  </div>
} @else if (plans().length === 0) {
    <div class="rounded-2xl bg-white/60 border border-slate-100/80 p-8 sm:p-12 text-center">
    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-100 flex items-center justify-center">
      <svg class="w-8 h-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
    </div>
    <p class="text-slate-400 text-sm mb-4">No hay suscripciones registradas</p>
    <app-button variant="secondary" (clicked)="createClicked.emit()">Agregar tu primera suscripción</app-button>
  </div>
} @else {
  <div class="flex flex-col gap-y-3 sm:gap-y-4">
    @for (plan of plans(); track plan.id) {
      <app-plan-item
        [plan]="plan"
        (editClicked)="editClicked.emit($event)"
        (deleteClicked)="deleteClicked.emit($event)"
      />
    }
  </div>
}
