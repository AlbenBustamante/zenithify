<div class="flex sm:flex-col items-end sm:items-center gap-1 sm:ml-auto">
  <p class="text-xs text-slate-400">
    <span class="font-medium text-slate-500">Próximo cobro:</span>
  </p>
  <p class="text-sm font-medium" [class]="isUrgent() ? 'text-amber-600' : 'text-slate-600'">
    <time [attr.datetime]="nextBillingDate().toString()">{{ formattedDate() }}</time>
    <span class="text-xs text-slate-400 ml-1">({{ daysUntil() }}d)</span>
  </p>
</div>
