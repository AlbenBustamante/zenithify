<button
  type="button"
  class="absolute top-3 right-3 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors cursor-pointer z-10"
  [attr.aria-label]="'Menú de acciones para ' + planName()"
  [attr.aria-expanded]="menuOpen()"
  [disabled]="menuOpen()"
  aria-haspopup="menu"
  (click)="toggleMenu()"
  (keydown.escape)="closeMenu()"
>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z"
    />
  </svg>
</button>
