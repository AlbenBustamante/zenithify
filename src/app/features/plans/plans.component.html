<div class="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-stone-100 px-4 py-8">
  <div class="max-w-7xl mx-auto flex flex-col gap-y-8">
    <header class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
      <div class="flex flex-col gap-y-2">
        <div class="flex items-center gap-3">
          <span class="w-1 h-8 bg-amber-500 rounded-full"></span>
          <h1 class="text-4xl font-bold text-slate-900 tracking-tight">Planes y Suscripciones</h1>
        </div>
        <p class="text-slate-500 text-sm">Gestiona tus suscripciones recurrentes</p>
      </div>
      <app-button (clicked)="openCreateModal()">
        <svg
          class="w-4 h-4 mr-1.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo Plan
      </app-button>
    </header>

    @if (isDataLoading()) {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        @for (i of [1, 2, 3]; track i) {
          <div class="h-32 rounded-2xl bg-slate-200 animate-pulse"></div>
        }
      </div>
      <app-plans-list [plans]="[]" [loading]="true" />
    } @else {
      <div class="flex flex-col gap-y-8">
        <app-plans-stats>
          <span monthly class="text-3xl font-bold text-slate-900">{{
            formatMoney(monthlyTotal(), 'USD')
          }}</span>
          <span yearly class="text-3xl font-bold text-slate-900">{{
            formatMoney(yearlyTotal(), 'USD')
          }}</span>
          <span active class="text-3xl font-bold text-slate-900">{{ activePlans().length }}</span>
        </app-plans-stats>

        <app-plans-list
          [plans]="plans()"
          (createClicked)="openCreateModal()"
          (editClicked)="openEditModal($event)"
          (deleteClicked)="confirmDelete($event)"
        />
      </div>
    }
  </div>
</div>

<app-plan-form-modal
  [isOpen]="isModalOpen()"
  [editingPlan]="editingPlan()"
  [loading]="isLoading()"
  (close)="closeModal()"
  (save)="onSave($event)"
/>

<app-plan-delete-modal
  [isOpen]="isDeleteModalOpen()"
  [loading]="isLoading()"
  (confirm)="onDelete()"
  (cancel)="closeDeleteModal()"
/>
