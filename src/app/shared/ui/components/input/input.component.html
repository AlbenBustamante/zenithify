<div class="w-full">
  @if (label()) {
    <label [for]="inputId()" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <div class="relative">
    @if (prefix()) {
      <span class="absolute left-2.5 sm:left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs sm:text-sm">{{ prefix() }}</span>
    }
    <input
      [id]="inputId()"
      [type]="type()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [value]="value()"
      [class]="inputClasses"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if (suffix()) {
      <span class="absolute right-2.5 sm:right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs sm:text-sm">{{ suffix() }}</span>
    }
  </div>
  @if (error()) {
    <p class="mt-1 sm:mt-1.5 text-xs sm:text-sm text-red-600">{{ error() }}</p>
  }
  @if (hint() && !error()) {
    <p class="mt-1 sm:mt-1.5 text-xs sm:text-sm text-gray-500">{{ hint() }}</p>
  }
</div>
